name: .NET Tests

on:
  push:
    branches: [ main, dev_IO, develop ]
  pull_request:
    branches: [ main, dev_IO, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: |
        dotnet restore graphic_editor.csproj
        dotnet restore tests/graphic_editor.Tests/graphic_editor.Tests.csproj

    - name: Build
      run: |
        dotnet build graphic_editor.csproj --configuration Release --no-restore
        dotnet build tests/graphic_editor.Tests/graphic_editor.Tests.csproj --configuration Release --no-restore

    - name: Test
      run: dotnet test tests/graphic_editor.Tests/graphic_editor.Tests.csproj --configuration Release --no-build --verbosity normal